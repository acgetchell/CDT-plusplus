---
name: Python experiments

"on":
  push:
    branches:
      - main
    paths:
      - .github/actions/setup-just/action.yml
      - .github/workflows/python-experiments.yml
      - .python-version
      - Justfile
      - pyproject.toml
      - scripts/experiment_artifacts.py
      - scripts/experiment_tests/**
      - scripts/mnist_experiment.py
      - scripts/optimize_initialize.py
      - ty.toml
      - uv.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/setup-just/action.yml
      - .github/workflows/python-experiments.yml
      - .python-version
      - Justfile
      - pyproject.toml
      - scripts/experiment_artifacts.py
      - scripts/experiment_tests/**
      - scripts/mnist_experiment.py
      - scripts/optimize_initialize.py
      - ty.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86-64
            os: ubuntu-latest
          - name: macOS ARM64
            os: macos-15
          - name: Windows x86-64
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Just
        uses: ./.github/actions/setup-just

      - name: Resolve uv version
        id: tool-versions
        shell: bash
        run: echo "uv=$(just --evaluate uv_version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ steps.tool-versions.outputs.uv }}

      - name: Resolve wheels, type-check, and run offline experiment tests
        run: just python-experiment-check
