---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler_package: gnu.org/gcc@16
            cc: gcc
            cxx: g++
            compiler_cache: ccache
            compiler_cache_key: gcc-16
            run_parallel_contract: true
          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler_package: llvm.org@22
            cc: clang
            cxx: clang++
            compiler_cache: ccache
            compiler_cache_key: clang-22
            run_parallel_contract: true
          - name: macOS AppleClang
            os: macos-latest
            compiler_package: ""
            cc: clang
            cxx: clang++
            compiler_cache: ""
            compiler_cache_key: none
            run_parallel_contract: false
          - name: Windows MSVC
            os: windows-latest
            compiler_package: ""
            cc: cl
            cxx: cl
            compiler_cache: ""
            compiler_cache_key: none
            run_parallel_contract: false

    steps:
      - name: Disable Git autocrlf on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up Just
        uses: ./.github/actions/setup-just

      - name: Resolve CI tool versions
        id: tool-versions
        shell: bash
        run: |
          {
            echo "cmake=$(just --evaluate cmake_version)"
            echo "ccache=$(just --evaluate ccache_version)"
            echo "llvm=$(just --evaluate llvm_version)"
            echo "ninja=$(just --evaluate ninja_version)"
            echo "ninja-windows-wheel=$(just --evaluate ninja_windows_wheel_version)"
            echo "typos=$(just --evaluate typos_version)"
            echo "uv=$(just --evaluate uv_version)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up typos
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf  # v2.85.5
        with:
          tool: typos@${{ steps.tool-versions.outputs.typos }}

      - name: Set up canonical CI environment with pkgx
        if: runner.os != 'Windows'
        uses: pkgxdev/setup@4d4ae97af87ccb39ab8be4e073dea697fef2c6f7  # v5.0.0
        with:
          +: >-
            llvm.org@${{ steps.tool-versions.outputs.llvm }}
            cmake.org@${{ steps.tool-versions.outputs.cmake }}
            ninja-build.org@${{ steps.tool-versions.outputs.ninja }}

      - name: Resolve pkgx certificate bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ssl_cert_file="$(
            env -u SSL_CERT_FILE pkgx +curl.se/ca-certs env |
              sed -n 's/^SSL_CERT_FILE=//p'
          )"
          if [[ -z "$ssl_cert_file" || ! -r "$ssl_cert_file" ]]; then
            echo "pkgx CA bundle is missing or unreadable: $ssl_cert_file" >&2
            exit 1
          fi
          echo "SSL_CERT_FILE=$ssl_cert_file" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ steps.tool-versions.outputs.uv }}

      # pkgx's CMake and Ninja packages do not currently support Windows.
      - name: Set up pinned Windows wheel toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_VERSION: ${{ steps.tool-versions.outputs.cmake }}
          NINJA_VERSION: ${{ steps.tool-versions.outputs.ninja-windows-wheel }}
        run: |
          uv tool install --no-build "cmake==$env:CMAKE_VERSION"
          uv tool install --no-build "ninja==$env:NINJA_VERSION"
          uv tool dir --bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP 'pinact-bin'
          New-Item -ItemType Directory -Force -Path $installDirectory | Out-Null
          $env:GOBIN = $installDirectory
          $pinactModule = just --evaluate pinact_module
          go install $pinactModule
          $installDirectory >> $env:GITHUB_PATH

      - name: Select the Windows vcpkg triplet
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_DEFAULT_TRIPLET=x64-windows'

      - name: Restore artifacts or set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/.cache/vcpkg

      - name: Restore compiler cache
        if: matrix.compiler_cache != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ matrix.compiler_cache_key }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ matrix.compiler_cache_key }}-

      - name: Run the canonical local CI contract
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 1G
          CC: ${{ matrix.cc }}
          CDT_COMPILER_CACHE: ${{ matrix.compiler_cache }}
          CDT_PKGX_COMPILER_PACKAGE: ${{ matrix.compiler_package }}
          CXX: ${{ matrix.cxx }}
        run: just ci

      - name: Run the opt-in CGAL/oneTBB contract
        if: matrix.run_parallel_contract
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_MAXSIZE: 1G
          CC: ${{ matrix.cc }}
          CDT_COMPILER_CACHE: ${{ matrix.compiler_cache }}
          CDT_PKGX_COMPILER_PACKAGE: ${{ matrix.compiler_package }}
          CXX: ${{ matrix.cxx }}
        run: just build-parallel

      - name: Report compiler cache statistics
        if: ${{ always() && matrix.compiler_cache != '' }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_VERSION: ${{ steps.tool-versions.outputs.ccache }}
        run: >-
          pkgx "+ccache.dev@${CCACHE_VERSION}" --
          ccache --show-stats

  build:
    name: build
    if: ${{ always() }}
    needs:
      - platform
    runs-on: ubuntu-latest

    steps:
      - name: Verify platform matrix
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "${PLATFORM_RESULT}" = success
